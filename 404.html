<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - System Not Found | Mathew Varghese</title>
    <meta name="description" content="Error 404: The requested system node does not exist in Mathew Varghese's portfolio.">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2308080f' width='100' height='100' rx='16'/%3E%3Ctext x='50' y='65' text-anchor='middle' fill='%2300e5ff' font-family='sans-serif' font-weight='bold' font-size='44'%3EMV%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Archivo:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-xl) var(--space-md);
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05) 0%, var(--bg-primary) 70%);
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(80px, 15vw, 150px);
            font-weight: 700;
            line-height: 1;
            margin-bottom: var(--space-md);
            color: var(--text-primary);
            position: relative;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .error-code::before,
        .error-code::after {
            content: "404";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
            pointer-events: none;
        }

        .error-code::before {
            color: var(--accent-cyan);
            z-index: -1;
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        .error-code::after {
            color: var(--accent-magenta);
            z-index: -2;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
            40% { clip-path: inset(30% 0 40% 0); transform: translate(2px, -2px); }
            60% { clip-path: inset(15% 0 80% 0); transform: translate(-1px, 1px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); }
            100% { clip-path: inset(5% 0 90% 0); transform: translate(-2px, 1px); }
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: var(--space-md);
            letter-spacing: -0.02em;
        }

        .error-desc {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 500px;
            margin-bottom: var(--space-2xl);
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <!-- ===== CUSTOM CURSOR ===== -->
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-outline" id="cursorOutline"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo" aria-label="Home">
                <span class="logo-bracket">[</span><span class="logo-text">MV</span><span class="logo-bracket">]</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#skills" class="nav-link">Skills</a>
                <a href="index.html#projects" class="nav-link">Projects</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
        </div>
    </nav>

    <!-- ===== MOBILE MENU OVERLAY ===== -->
    <div class="mobile-menu" id="mobileMenu">
        <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <div class="mobile-menu-links">
            <a href="index.html#about" class="mobile-link">About</a>
            <a href="index.html#skills" class="mobile-link">Skills</a>
            <a href="index.html#projects" class="mobile-link">Projects</a>
            <a href="index.html#contact" class="mobile-link">Contact</a>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="error-page">
        <div class="floating-shape shape-cube-wrap" style="position: absolute; top: 15%; left: 15%; opacity: 0.3;">
            <div class="mini-cube">
                <div class="mc-face mc-front"></div>
                <div class="mc-face mc-back"></div>
                <div class="mc-face mc-left"></div>
                <div class="mc-face mc-right"></div>
                <div class="mc-face mc-top"></div>
                <div class="mc-face mc-bottom"></div>
            </div>
        </div>
        <div class="floating-shape shape-cross" style="position: absolute; bottom: 20%; right: 20%; opacity: 0.3;"></div>
        
        <h1 class="error-code">404</h1>
        <h2 class="error-title">CONNECTION LOST</h2>
        <p class="error-desc">The node you are trying to access has been deleted, moved, or never existed in the current physical dimension.</p>
        <a href="index.html" class="btn btn-primary">
            <span class="btn-text">REBOOT SYSTEM (GO HOME)</span>
            <span class="btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </span>
        </a>
    </main>

    <script src="script.js"></script>
    <script>
        // Disable preloader script logic from interfering
        const preloader = document.getElementById('preloader');
        if (preloader) preloader.style.display = 'none';
        
        // Remove simple cursor logic to avoid errors if elements don't exist
        window.addEventListener('load', () => {
            const body = document.body;
            body.classList.add('loaded');
        });
    </script>
</body>
</html>
